name: Brainpod crews-tickle

on:
  push:
    branches: ["main", "brainpod/onboarding-crews-tickle"]
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v5
      - uses: brainpodnl/actions/build@v1
        with:
          pod: crews-tickle
